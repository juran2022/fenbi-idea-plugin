org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false

# 本机已装的 IntelliJ IDEA 目录：直接用它作编译目标平台，省掉下载 ~1.5 GB 的 IDEA 发行包
# 换机器时改成自己的安装路径；删掉这行则回落到 build.gradle.kts 里 create(...) 在线下载
ideaHome=D:\\IntelliJ IDEA 2026.2.3

# 2026.2 平台是 Java 25 字节码，编译必须用 JDK 25；IDEA 自带的 jbr 就是 JDK 25
org.gradle.java.installations.paths=D:\\IntelliJ IDEA 2026.2.3\\jbr
